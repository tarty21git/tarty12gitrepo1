<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - International Payment Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { background: #1e293b; border-radius: 12px; padding: 2rem; width: 350px; }
    </style>
</head>
<body>
<div class="card">
    <h4 class="text-center mb-3">CTH Payment Portal</h4>
    <form action="/login" method="post">
        <div class="mb-3">
            <label>Username</label>
            <input type="text" name="username" class="form-control bg-dark text-white border-secondary" required value="admin">
        </div>
        <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required value="admin123">
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign In</button>
    </form>
</div>
</body>
</html>
